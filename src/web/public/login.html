<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sheeridVerify · 登录</title><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body>
<header><a class="brand" href="/">sheeridVerify<span>验证工作台</span></a>
  <div class="header-auth"><span class="badge" id="connection">连接中</span></div>
</header>
<main>
  <div class="login-center">
    <form id="login-form" autocomplete="off">
      <section class="card login-card">
        <div class="section-title"><h2>登录</h2></div>
        <label>账号<input id="login-username" name="username" autocomplete="username" required placeholder="请输入账号"></label>
        <label>密码<input id="login-password" name="loginPassword" type="password" autocomplete="current-password" required placeholder="请输入密码"></label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <div class="actions"><button id="login-submit" type="submit" class="primary">登录</button></div>
      </section>
    </form>
  </div>
  <footer>sheeridVerify / 本机工作台<span>登录后进入任务页面</span></footer>
</main></body></html>
